name: EventEdge Oracle
description: >-
  Read-only, machine-readable prediction-market context (Polymarket + Kalshi) built for autonomous AI agents. Provides
  decision-support data only (no trade execution), accessed via the x402 pay-per-request payment protocol (USDC on
  Base). Exposes a REST API (OpenAPI 3.1), a live remote MCP server, an A2A agent card backed by a live /a2a JSON-RPC
  endpoint, and llms.txt / ai-plugin / x402 discovery surfaces.
